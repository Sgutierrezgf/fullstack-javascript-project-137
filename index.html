<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>RSS Reader</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">RSS Reader</h1>

      <form class="rss-form row g-3">
        <div class="col-md-8">
          <input
            type="text"
            class="form-control rss-input"
            name="url"
            required
            placeholder="URL del RSS"
          />
          <div class="feedback text-danger mt-2"></div>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary w-100">
            Agregar
          </button>
        </div>
      </form>

      <div class="row mt-5">
        <div class="col-md-6">
          <h3>Feeds</h3>
          <ul class="feeds list-group"></ul>
        </div>

        <div class="col-md-6">
          <h3>Posts</h3>
          <ul class="posts list-group"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
