<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>RSS Reader</title>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="mb-4">RSS Reader</h1>

      <form class="rss-form row g-3">
  <div class="col-md-8">
    <input
      type="text"
      class="form-control rss-input"
      name="url"
      required
      placeholder="URL del RSS"
    />
  </div>
  <div class="col-md-4">
    <button class="btn btn-primary w-100" type="submit">
      Agregar
    </button>
  </div>
</form>
    </div>
  </body>
</html>
